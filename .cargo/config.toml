[target.'cfg(target_env = "musl")']
# musl targets default to a static C runtime, but Alpine's GTK, Vulkan,
# FFmpeg, and audio development packages provide shared libraries. SDL3 is
# built statically from source by Cargo.
rustflags = ["-C", "target-feature=-crt-static"]

[target.'cfg(target_os = "openbsd")']
# cubeb-sys 0.34 emits -lstdc++ on every non-FreeBSD Unix target, while
# OpenBSD's system compiler and the bundled libcubeb use libc++. setup.sh
# creates this project-local compatibility library name.
rustflags = ["-L", "native=.cargo/openbsd-lib"]

[target.'cfg(target_os = "freebsd")']
# SDL3 is built from source and uses FreeBSD's libusbhid for its joystick
# backend, but sdl3-sys does not emit the corresponding link flag, so the
# final binary fails on hid_init and friends.
rustflags = ["-l", "usbhid"]
