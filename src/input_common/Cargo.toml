[package]
name = "input_common"
version.workspace = true
edition.workspace = true

[features]
default = []
# Mirrors Eden's ENABLE_LIBUSB compilation boundary. The USB transport and
# InputSubsystem registration must be ported before this can be enabled by a
# frontend build.
libusb = []

[dependencies]
common.workspace = true
log.workspace = true
bitflags.workspace = true
parking_lot.workspace = true
sdl3-sys.workspace = true

# SDL3 backs the upstream `sdl` input engine guarded by HAVE_SDL3. The raw
# bindings share the workspace's statically built SDL runtime on every target.
