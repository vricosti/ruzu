[package]
name = "audio_core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
common = { path = "../common" }
ruzu_core = { package = "core", path = "../core" }
cubeb.workspace = true
log.workspace = true
parking_lot.workspace = true

[target.'cfg(not(windows))'.dependencies]
sdl2.workspace = true

[target.'cfg(windows)'.dependencies]
# Native Windows builds use the x64-windows libraries installed by vcpkg.
sdl2 = { workspace = true, features = ["use-vcpkg"] }
winapi = { version = "0.3", features = ["combaseapi", "objbase"] }

# cubeb-sys 0.34 asks Cargo to link the optional Rust PulseAudio archive on
# FreeBSD, although its nested CMake build does not place that archive in the
# target-specific directory expected by build.rs. Keep the portable C backends
# workaround limited to the affected target.
[target.'cfg(target_os = "freebsd")'.dependencies]
cubeb-sys = { workspace = true, features = ["unittest-build"] }
