RUST_LOG = "info"
RUZU_TRACE_PRESENT_PHASES = "1"
RUZU_TRACE_PRESENT_PHASES_EVERY = "120"
RUZU_TRACE_PRESENT_TEXTURE_SAMPLE = "1"
RUZU_TRACE_PRESENT_TEXTURE_SAMPLE_EVERY = "60"
RUZU_TRACE_PRESENT_DRAW = "1"
