match_process_pid = true
window_wait_timeout = "00:00:20"
screenshot_prefix = "mk8d-opengl-present-probe"
times = ["00:00:20.000", "00:00:22.000"]

[video]
enabled = false
end = "00:00:22"
output = "unused.mp4"
