[process]
executable = "../../target/release/reden"
rom_path = "/home/vricosti/Games/Emulators/Switch/common/roms/commercial/Mario Kart 8 Deluxe [NSP]/Mario Kart 8 Deluxe [0100152000022000][v0].nsp"
args = []
working_directory = "../.."
log_file = "../../screenshots/reden/mk8d-opengl-present-probe-20260818/process.log"
