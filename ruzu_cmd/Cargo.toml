[package]
name = "ruzu_cmd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
debug-logs = ["ruzu_core/debug-logs"]

[[bin]]
name = "ruzu-cmd"
path = "src/main.rs"

[dependencies]
common = { workspace = true }
ruzu_core = { package = "core", path = "../core" }
audio_core = { path = "../audio_core" }
hid_core = { path = "../hid_core" }
video_core = { workspace = true }
input_common = { workspace = true }
frontend_common = { workspace = true }
parking_lot.workspace = true
gl = { workspace = true }
ash = { workspace = true }
raw-window-handle = { workspace = true }
clap = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
rdynarmic = { workspace = true }

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd", target_os = "dragonfly"))'.dependencies]
sdl2 = { version = "0.37", features = ["raw-window-handle", "use-pkgconfig"] }

[target.'cfg(target_os = "windows")'.dependencies]
sdl2.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
